server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS centralizado: el navegador ahora solo le habla al gateway,
      # asi que ya no es obligatorio tener CorsConfig.java repetido en cada
      # microservicio (aunque dejarlo no hace daño mientras migran).
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5500"
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**

        - id: catalog-service
          uri: http://catalog-service:8082
          predicates:
            - Path=/api/catalog/**

        - id: wishlist-service
          uri: http://wishlist-service:8083
          predicates:
            - Path=/api/wishlist/**

        - id: history-service
          uri: http://history-service:8084
          predicates:
            - Path=/api/history/**