server:
  port: 8084

spring:
  application:
    name: history-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/history_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

wishlist:
  base-url: ${WISHLIST_BASE_URL:http://localhost:8083}

jwt.secret: ${JWT_SECRET}