server:
  port: 8083

spring:
  application:
    name: wishlist-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/wishlist_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8082}